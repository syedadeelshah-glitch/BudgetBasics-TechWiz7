<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="beeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B22" />
      <stop offset="100%" stop-color="#FFA41B" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2022" />
      <stop offset="100%" stop-color="#343A40" />
    </linearGradient>
  </defs>
  <!-- Hexagonal Honeycomb Icon -->
  <g transform="translate(10, 8)">
