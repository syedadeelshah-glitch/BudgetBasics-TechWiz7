    <!-- Inner Bee/Dollar geometry -->
    <path d="M22 14v16M17 18h10M17 26h10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="11" r="2" fill="#FFFFFF"/>
    <!-- Cute bee wing accent -->
    <ellipse cx="36" cy="12" rx="4" ry="2.5" transform="rotate(-30 36 12)" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <!-- Brand Name Typography -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#1E2022" class="brand-text-dark">
    Budget<tspan fill="#FF5B22">Basics</tspan>
  </text>
  <!-- Sub-badge -->
  <g transform="translate(64, 38)">
    <rect width="105" height="15" rx="7.5" fill="#FFF3E0"/>
    <text x="52" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#E65100" text-anchor="middle" letter-spacing="0.5">NEXTGEN BUDGETBEE</text>
  </g>
