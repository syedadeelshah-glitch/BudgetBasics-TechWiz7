    <text x="424" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#0F172A">Zero-Spend Days</text>
    <text x="424" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Host dorm game night</text>
    <text x="424" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Campus park walks</text>
    <text x="424" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• No online checkout</text>
