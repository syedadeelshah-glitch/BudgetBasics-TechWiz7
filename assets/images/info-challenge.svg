  <!-- 4 Milestones Cards -->
  <g transform="translate(30, 95)">
    <!-- Week 1 -->
    <rect x="0" y="0" width="126" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="10" y="10" width="34" height="20" rx="10" fill="#E2E8F0"/>
    <text x="27" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#475569" text-anchor="middle">WK 1</text>
    <text x="10" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#0F172A">Subscription Audit</text>
    <text x="10" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Cancel trial apps</text>
    <text x="10" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Student pricing tier</text>
    <text x="10" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Stop auto-renewals</text>
    <rect x="10" y="136" width="106" height="22" rx="6" fill="#DCFCE7"/>
    <text x="63" y="151" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Est: Saves $35</text>

    <!-- Week 2 -->
    <rect x="138" y="0" width="126" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="148" y="10" width="34" height="20" rx="10" fill="#E2E8F0"/>
    <text x="165" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#475569" text-anchor="middle">WK 2</text>
    <text x="148" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#0F172A">Pantry Cook-Off</text>
    <text x="148" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Meal prep 4 dinners</text>
    <text x="148" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Pack campus lunch</text>
    <text x="148" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Use dorm staples</text>
    <rect x="148" y="136" width="106" height="22" rx="6" fill="#DCFCE7"/>
    <text x="201" y="151" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Est: Saves $60</text>

    <!-- Week 3 -->
    <rect x="276" y="0" width="126" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
