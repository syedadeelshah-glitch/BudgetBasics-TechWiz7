  <!-- Total Savings Summary -->
  <g transform="translate(30, 290)">
    <rect width="540" height="96" rx="14" fill="#FFF7ED" stroke="#FFEDD5"/>
    <circle cx="44" cy="48" r="22" fill="#FF5B22"/>
    <text x="44" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">★</text>
    <text x="80" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#9A3412">Total Estimated Month 1 Savings: $200.00+</text>
