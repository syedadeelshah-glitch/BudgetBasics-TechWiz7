    <text x="286" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Borrow course books</text>
    <text x="286" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Free campus fitness</text>
    <text x="286" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B">• Free student events</text>
    <rect x="286" y="136" width="106" height="22" rx="6" fill="#DCFCE7"/>
    <text x="339" y="151" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Est: Saves $55</text>

    <!-- Week 4 -->
    <rect x="414" y="0" width="126" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="424" y="10" width="34" height="20" rx="10" fill="#E2E8F0"/>
