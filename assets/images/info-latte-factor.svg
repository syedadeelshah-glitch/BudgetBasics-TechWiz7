<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <rect width="600" height="420" rx="20" fill="#FFFFFF"/>
  <rect x="2" y="2" width="596" height="416" rx="18" stroke="#F1F5F9" stroke-width="2"/>
  
  <text x="30" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A">The Latte Factor: The Multiplier of Small Leaks</text>
  <text x="30" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B">A harmless $4.50 daily purchase compounds into immense student capital</text>

  <!-- Visual timeline comparison -->
  <g transform="translate(30, 95)">
    <!-- 1 Day -->
    <rect x="0" y="0" width="120" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="60" cy="40" r="22" fill="#FFF7ED"/>
    <text x="60" y="46" font-size="20" text-anchor="middle">☕</text>
    <text x="60" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">1 Day</text>
    <text x="60" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle">$4.50</text>
    <text x="60" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">A single cup</text>
    <text x="60" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Feels harmless</text>

    <!-- 1 Month -->
    <rect x="140" y="0" width="120" height="180" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
    <circle cx="200" cy="40" r="22" fill="#FFEDD5"/>
    <text x="200" y="46" font-size="20" text-anchor="middle">📦</text>
    <text x="200" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">1 Month</text>
    <text x="200" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#C2410C" text-anchor="middle">$135.00</text>
    <text x="200" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#EA580C" text-anchor="middle">2 weeks of</text>
    <text x="200" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#EA580C" text-anchor="middle">healthy groceries</text>

    <!-- 1 Year -->
    <rect x="280" y="0" width="120" height="180" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
    <circle cx="340" cy="40" r="22" fill="#FEE2E2"/>
    <text x="340" y="46" font-size="20" text-anchor="middle">💻</text>
    <text x="340" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">1 School Year</text>
    <text x="340" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#B91C1C" text-anchor="middle">$1,620.00</text>
    <text x="340" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#B91C1C" text-anchor="middle">Covers brand new</text>
    <text x="340" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#B91C1C" text-anchor="middle">laptop or tablet</text>

    <!-- 4 Years Degree -->
    <rect x="420" y="0" width="120" height="180" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="480" cy="40" r="22" fill="#D1FAE5"/>
    <text x="480" y="46" font-size="20" text-anchor="middle">🚀</text>
    <text x="480" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">4 College Years</text>
    <text x="480" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">$6,480.00</text>
    <text x="480" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">Invested Seed Fund</text>
    <text x="480" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">For Post-Grad Life</text>
  </g>

  <!-- Key Takeaway -->
  <rect x="30" y="295" width="540" height="90" rx="14" fill="#F0FDF4" stroke="#DCFCE7"/>
  <text x="50" y="328" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#15803D">💡 The Solution Isn't Zero Enjoyment:</text>
  <text x="50" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#166534">Brew your morning cup in a reusable dorm tumbler 4 days a week, and enjoy the coffee shop with friends once a week.</text>
  <text x="50" y="368" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#15803D">You save $1,200 every year without feeling deprived!</text>
</svg>
