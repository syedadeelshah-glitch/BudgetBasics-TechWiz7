<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <rect width="600" height="420" rx="20" fill="#FFFFFF"/>
  <rect x="2" y="2" width="596" height="416" rx="18" stroke="#F1F5F9" stroke-width="2"/>
  
  <text x="30" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A">The Student Monthly Budget Flow</text>
  <text x="30" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B">How money should travel through your accounts each month</text>

  <!-- Flow pipeline -->
  <!-- Deposit Node -->
  <g transform="translate(30, 110)">
    <rect width="140" height="90" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#3B82F6"/>
    <text x="28" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">$</text>
    <text x="50" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#1E293B">Allowance</text>
    <text x="16" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Day 1: Stipend / Job income arrives</text>
  </g>

  <!-- Split arrows -->
  <path d="M170 155 L220 155" stroke="#94A3B8" stroke-width="2"/>

  <!-- Pay Yourself First Node (Savings Vault) -->
  <g transform="translate(225, 80)">
    <rect width="160" height="70" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#065F46">Step 1: Save 20% First</text>
    <text x="16" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#047857">Transfer $200 directly into</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#047857">emergency high-yield vault</text>
  </g>

  <!-- Step 2: Fixed Needs -->
  <g transform="translate(225, 170)">
    <rect width="160" height="70" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#1E40AF">Step 2: Clear Fixed Bills</text>
    <text x="16" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#2563EB">Pay rent, tuition, phone,</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#2563EB">and monthly transit pass</text>
  </g>

  <!-- Final Node: Weekly Flexible Allowance -->
  <g transform="translate(425, 120)">
    <rect width="145" height="100" rx="14" fill="#FFF7ED" stroke="#FF5B22" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="12" fill="#FF5B22"/>
    <text x="26" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="46" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#9A3412">Remainder</text>
    <text x="14" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#C2410C">Divide by 4 Weeks</text>
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#EA580C">Enjoy guilt-free dining &amp;</text>
    <text x="14" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#EA580C">leisure within weekly cap</text>
  </g>

  <!-- Connectors -->
  <path d="M385 115 L425 150" stroke="#94A3B8" stroke-width="2"/>
  <path d="M385 205 L425 170" stroke="#94A3B8" stroke-width="2"/>

  <!-- Key Rule box -->
  <rect x="30" y="280" width="540" height="90" rx="14" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="50" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#6B21A8">🧠 The Golden Rule of Student Cashflow:</text>
  <text x="50" y="334" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#7E22CE">Never let variable discretionary spending occur before your savings and fixed commitments are locked in.</text>
  <text x="50" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9333EA">"Do not save what is left after spending, but spend what is left after saving." — Warren Buffett</text>
</svg>
