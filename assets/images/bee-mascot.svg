<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="65%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#F77F00"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Wings -->
  <ellipse cx="42" cy="38" rx="20" ry="13" transform="rotate(-35 42 38)" fill="url(#wingGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="78" cy="38" rx="20" ry="13" transform="rotate(35 78 38)" fill="url(#wingGrad)" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Antennae -->
  <path d="M52 46 C48 34 38 34 38 40" stroke="#1E2022" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="40" r="3" fill="#FF5B22"/>
  <path d="M68 46 C72 34 82 34 82 40" stroke="#1E2022" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="40" r="3" fill="#FF5B22"/>

  <!-- Bee Body -->
  <ellipse cx="60" cy="68" rx="34" ry="28" fill="url(#bodyGrad)"/>

  <!-- Black Stripes -->
  <path d="M48 48 C56 50 64 50 72 48 C72 54 70 60 68 62 C60 63 56 63 52 62 C50 60 48 54 48 48 Z" fill="#1E2022"/>
  <path d="M43 68 C54 71 66 71 77 68 C76 74 74 80 72 82 C64 84 56 84 48 82 C46 80 44 74 43 68 Z" fill="#1E2022"/>

  <!-- Friendly Eyes with Specular Highlights -->
  <circle cx="50" cy="62" r="5" fill="#1E2022"/>
  <circle cx="48.5" cy="60" r="1.8" fill="#FFFFFF"/>
  <circle cx="70" cy="62" r="5" fill="#1E2022"/>
  <circle cx="68.5" cy="60" r="1.8" fill="#FFFFFF"/>

  <!-- Cute Rosy Cheeks -->
  <circle cx="43" cy="68" r="4" fill="#FF5B22" opacity="0.4"/>
  <circle cx="77" cy="68" r="4" fill="#FF5B22" opacity="0.4"/>

  <!-- Happy Smile -->
  <path d="M56 68 Q60 74 64 68" stroke="#1E2022" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Small Stinger Bottom -->
  <path d="M57 95 L60 102 L63 95 Z" fill="#1E2022"/>

  <!-- Graduation Cap or Coin floating beside -->
  <circle cx="92" cy="85" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="92" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>
</svg>
