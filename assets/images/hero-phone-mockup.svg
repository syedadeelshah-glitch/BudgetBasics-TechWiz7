<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#FF5B22" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF7A00" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B22" />
      <stop offset="100%" stop-color="#FFA41B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Phone -->
  <circle cx="340" cy="280" r="180" fill="#FF5B22" opacity="0.08" filter="blur(40px)" />
  <circle cx="180" cy="460" r="140" fill="#FFA41B" opacity="0.06" filter="blur(30px)" />

  <!-- Floating Element Top-Left: Savings Goal -->
  <g transform="translate(40, 60)" filter="url(#cardShadow)">
    <rect width="180" height="74" rx="18" fill="#FFFFFF" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">Savings Goal</text>
    <text x="16" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#111827">$3,200 <tspan font-size="12" font-weight="500" fill="#9CA3AF">/ $5,000</tspan></text>
    <!-- Progress track -->
    <rect x="16" y="54" width="115" height="6" rx="3" fill="#F3F4F6" />
    <rect x="16" y="54" width="74" height="6" rx="3" fill="url(#greenGrad)" />
    <text x="140" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#10B981">64%</text>
  </g>

  <!-- Floating Coin Accent Top Left -->
  <circle cx="215" cy="50" r="18" fill="#FFA41B" filter="url(#cardShadow)"/>
  <text x="215" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>

  <!-- Floating Element Top-Right: Monthly Budget -->
  <g transform="translate(370, 140)" filter="url(#cardShadow)">
    <rect width="160" height="72" rx="18" fill="#FFFFFF" />
    <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">Monthly Budget</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#111827">$4,780 <tspan font-size="11" font-weight="500" fill="#9CA3AF">of $8k</tspan></text>
    <!-- Progress bar -->
    <rect x="14" y="52" width="100" height="6" rx="3" fill="#F3F4F6" />
    <rect x="14" y="52" width="60" height="6" rx="3" fill="url(#coralGrad)" />
    <text x="122" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FF5B22">60%</text>
  </g>

  <!-- Floating Orange Accent Icon -->
  <g transform="translate(230, 160)" filter="url(#cardShadow)">
    <rect width="36" height="36" rx="12" fill="url(#coralGrad)" />
    <circle cx="18" cy="18" r="8" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="35 15" fill="none" />
  </g>

  <!-- MAIN SMARTPHONE BODY -->
  <g transform="translate(140, 70)" filter="url(#softGlow)">
    <!-- Outer phone frame -->
    <rect width="280" height="570" rx="42" fill="url(#phoneBorder)" stroke="#E5E7EB" stroke-width="3"/>
    <!-- Inner Screen Area -->
    <rect x="10" y="10" width="260" height="550" rx="34" fill="#FFFFFF" />

    <!-- Status Bar (9:41, notch, icons) -->
    <text x="32" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#111827">9:41</text>
    <rect x="105" y="18" width="50" height="8" rx="4" fill="#111827" />
    <circle cx="218" cy="28" r="2.5" fill="#111827"/>
    <rect x="226" y="24" width="14" height="7" rx="2" stroke="#111827" stroke-width="1.2" fill="none"/>
    <rect x="228" y="26" width="9" height="3" rx="1" fill="#111827"/>

    <!-- Greeting Bar -->
    <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#9CA3AF">Good Morning,</text>
    <text x="24" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#111827">Alex 👋</text>
    <circle cx="236" cy="74" r="14" fill="#F9FAFB"/>
    <path d="M236 68v1a4 4 0 0 0 4 4v1h-8v-1a4 4 0 0 0 4-4v-1z" fill="#6B7280"/>
    <circle cx="240" cy="68" r="2.5" fill="#FF5B22"/>

    <!-- Total Balance Card -->
    <g transform="translate(20, 104)">
      <rect width="220" height="72" rx="16" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
      <text x="16" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9CA3AF">Total Balance</text>
      <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A">$24,680.50</text>
      <text x="16" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#9CA3AF">vs last month</text>
      <!-- Green Growth Pill -->
      <g transform="translate(142, 28)">
        <rect width="64" height="20" rx="10" fill="#DCFCE7"/>
        <text x="32" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">↗ +12.5%</text>
      </g>
    </g>

    <!-- Spending Overview Donut Card -->
    <g transform="translate(20, 190)">
      <rect width="220" height="130" rx="18" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1"/>
      <text x="16" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#111827">Spending Overview</text>
      
      <!-- Mini Donut SVG -->
      <g transform="translate(54, 76)">
        <circle cx="0" cy="0" r="34" stroke="#F3F4F6" stroke-width="10" fill="none"/>
        <!-- Needs (Blue/Purple): 50% = 106.8 of 213.6 -->
        <circle cx="0" cy="0" r="34" stroke="#6366F1" stroke-width="10" stroke-dasharray="106 107" stroke-dashoffset="0" fill="none" transform="rotate(-90)"/>
        <!-- Wants (Orange): 30% = 64 -->
        <circle cx="0" cy="0" r="34" stroke="#FF5B22" stroke-width="10" stroke-dasharray="64 149" stroke-dashoffset="-106" fill="none" transform="rotate(-90)"/>
        <!-- Savings (Green): 20% = 43 -->
        <circle cx="0" cy="0" r="34" stroke="#10B981" stroke-width="10" stroke-dasharray="43 170" stroke-dashoffset="-170" fill="none" transform="rotate(-90)"/>
        <text x="0" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#111827" text-anchor="middle">$4,780</text>
        <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">of $8,000</text>
      </g>

      <!-- Legend -->
      <g transform="translate(118, 48)">
        <circle cx="4" cy="6" r="3.5" fill="#6366F1"/>
        <text x="14" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#4B5563">Needs</text>
        <text x="86" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#111827" text-anchor="end">$2,250</text>

        <circle cx="4" cy="26" r="3.5" fill="#FF5B22"/>
        <text x="14" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#4B5563">Wants</text>
        <text x="86" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#111827" text-anchor="end">$1,450</text>

        <circle cx="4" cy="46" r="3.5" fill="#10B981"/>
        <text x="14" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#4B5563">Savings</text>
        <text x="86" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#111827" text-anchor="end">$1,080</text>
      </g>
    </g>

    <!-- Recent Transactions Header -->
    <g transform="translate(20, 335)">
      <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#111827">Recent Transactions</text>
      <text x="220" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FF5B22" text-anchor="end">See all</text>

      <!-- Row 1: Grocery Store -->
      <g transform="translate(0, 26)">
        <rect width="220" height="42" rx="12" fill="#F8FAFC"/>
        <rect x="8" y="7" width="28" height="28" rx="8" fill="#FEE2E2"/>
        <path d="M18 17h8l-1.5 6h-5z" stroke="#EF4444" stroke-width="1.5" fill="none"/>
        <text x="44" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1F2937">Campus Grocery</text>
        <text x="44" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#9CA3AF">Today, 2:15 PM</text>
        <text x="210" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#EF4444" text-anchor="end">-$86.24</text>
      </g>

      <!-- Row 2: Salary / Allowance -->
      <g transform="translate(0, 74)">
        <rect width="220" height="42" rx="12" fill="#F8FAFC"/>
        <rect x="8" y="7" width="28" height="28" rx="8" fill="#DCFCE7"/>
        <path d="M18 21l3-3m0 0l3 3m-3-3v8" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/>
        <text x="44" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1F2937">Campus Job / Salary</text>
        <text x="44" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#9CA3AF">Yesterday</text>
        <text x="210" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#16A34A" text-anchor="end">+$3,200.00</text>
      </g>
    </g>

    <!-- Home Indicator Bar -->
    <rect x="90" y="534" width="80" height="4" rx="2" fill="#D1D5DB" />
  </g>

  <!-- Floating Element Bottom-Right: Upcoming Bills -->
  <g transform="translate(360, 420)" filter="url(#cardShadow)">
    <rect width="160" height="74" rx="18" fill="#FFFFFF" />
    <text x="16" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9CA3AF">Upcoming Bills</text>
    <text x="16" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#111827">$680.00</text>
    <rect x="16" y="52" width="70" height="14" rx="7" fill="#FEE2E2"/>
    <text x="51" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#DC2626" text-anchor="middle">2 bills due</text>
    <!-- Calendar icon badge -->
    <circle cx="136" cy="40" r="14" fill="#FFF7ED"/>
    <path d="M131 35h10v10h-10z M131 38h10" stroke="#FF5B22" stroke-width="1.3" fill="none"/>
  </g>

  <!-- Small floating trend graph badge -->
  <g transform="translate(390, 310)" filter="url(#cardShadow)">
    <rect width="40" height="40" rx="12" fill="url(#coralGrad)"/>
    <path d="M10 28l6-7 7 4 9-11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
