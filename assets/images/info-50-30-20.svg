<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <rect width="600" height="420" rx="20" fill="#FFFFFF"/>
  <rect x="2" y="2" width="596" height="416" rx="18" stroke="#F1F5F9" stroke-width="2"/>
  
  <!-- Header -->
  <text x="30" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A">The 50-30-20 Rule Framework</text>
  <text x="30" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748B">A foundational, balanced distribution model for student income</text>

  <!-- Big Donut visualization in center left -->
  <g transform="translate(160, 230)">
    <!-- Base track -->
    <circle cx="0" cy="0" r="100" stroke="#F1F5F9" stroke-width="32" fill="none"/>
    <!-- Needs: 50% = 314 of 628 -->
    <circle cx="0" cy="0" r="100" stroke="#3B82F6" stroke-width="32" stroke-dasharray="314 314" stroke-dashoffset="0" fill="none" transform="rotate(-90)"/>
    <!-- Wants: 30% = 188 of 628 -->
    <circle cx="0" cy="0" r="100" stroke="#FF5B22" stroke-width="32" stroke-dasharray="188 440" stroke-dashoffset="-314" fill="none" transform="rotate(-90)"/>
    <!-- Savings: 20% = 126 of 628 -->
    <circle cx="0" cy="0" r="100" stroke="#10B981" stroke-width="32" stroke-dasharray="126 502" stroke-dashoffset="-502" fill="none" transform="rotate(-90)"/>

    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle">100%</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">INCOME</text>
  </g>

  <!-- Detail Columns on Right -->
  <g transform="translate(320, 110)">
    <!-- Needs card -->
    <rect x="0" y="0" width="250" height="74" rx="14" fill="#EFF6FF" stroke="#DBEAFE"/>
    <circle cx="24" cy="28" r="10" fill="#3B82F6"/>
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">50</text>
    <text x="44" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Needs (Essential)</text>
    <text x="44" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#3B82F6">Rent, Food Staples, Transit, Tuition</text>

    <!-- Wants card -->
    <rect x="0" y="88" width="250" height="74" rx="14" fill="#FFF7ED" stroke="#FFEDD5"/>
    <circle cx="24" cy="116" r="10" fill="#FF5B22"/>
    <text x="24" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">30</text>
    <text x="44" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#C2410C">Wants (Lifestyle)</text>
    <text x="44" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#EA580C">Dining out, Netflix, Gaming, Fashion</text>

    <!-- Savings card -->
    <rect x="0" y="176" width="250" height="74" rx="14" fill="#ECFDF5" stroke="#D1FAE5"/>
    <circle cx="24" cy="204" r="10" fill="#10B981"/>
    <text x="24" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">20</text>
    <text x="44" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#065F46">Savings &amp; Emergency</text>
    <text x="44" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#059669">Buffer fund, goal deposits, investments</text>
  </g>

  <!-- Bottom educational footnote -->
  <rect x="30" y="365" width="540" height="34" rx="8" fill="#F8FAFC"/>
  <text x="44" y="386" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#475569">💡 Student Flexibility: In high-cost areas, adapt to 60/25/15 or 70/20/10 until earnings grow.</text>
</svg>
